name: Keep Streamlit Alive
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and run Playwright
        run: |
          npm init -y
          npm i playwright
          npx playwright install chromium --with-deps
          node wake.js
