name: Keep Streamlit Alive
on:
  schedule:
    - cron: '0 13,15,17,19,21,23 * * 1-5'   # every 2h, 9am to 7pm ET weekdays (peak viewing)
    - cron: '0 1,5 * * *'                   # overnight safety net
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and run Playwright
        run: |
          npm init -y
          npm i playwright
          npx playwright install chromium --with-deps
          node wake.js
