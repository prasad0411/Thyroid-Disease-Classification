name: Keep Streamlit Alive

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:  # allows manual "Run workflow" button

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        run: curl -s -o /dev/null -w "%{http_code}" https://thyroid-disease-classification.streamlit.app/
